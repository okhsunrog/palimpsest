[package]
name = "palimpsest"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["process", "io-util", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "time"] }

[features]
# Enables `tests/integration_*.rs` against a real ZFS-capable host reachable
# via SSH (PALIMPSEST_SSH_TARGET=user@host:port). See `justfile` for the
# QEMU-based setup that uses the archzfs test ISO from the sibling
# archinstall_zfs repo.
integration = []
